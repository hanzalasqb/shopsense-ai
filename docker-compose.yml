services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shopsense
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shopsense-local}
      POSTGRES_DB: shopsense
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopsense"]
      interval: 5s
      retries: 10
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file: ./server/.env
    environment:
      DATABASE_URL: postgres://shopsense:${POSTGRES_PASSWORD:-shopsense-local}@db:5432/shopsense
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    depends_on: [server]
    ports:
      - "3000:80"
volumes:
  pgdata:
