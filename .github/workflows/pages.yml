name: Deploy live demo
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # commits downloaded demo images back to the repo
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: client/package-lock.json }
      - name: Download product photos (Unsplash License)
        run: node scripts/fetch-images.mjs
      - name: Commit new photos
        run: |
          if [ -n "$(git status --porcelain client/public/images scripts/images.lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A client/public/images scripts/images.lock.json
            git commit -m "chore: add demo product photos [skip ci]"
            git push
          fi
      - run: npm ci
        working-directory: client
      - name: Build browser-only demo
        run: npm run build
        working-directory: client
        env:
          VITE_DEMO: "true"
          VITE_BASE: /${{ github.event.repository.name }}/
      - run: cp client/dist/index.html client/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: client/dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
